name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            templates/persona-qa-dashboard/package-lock.json
      - name: Install platform dependencies
        run: npm ci
      - name: Install runtime template dependencies
        run: npm run setup:runtime
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and route tests
        run: npm test
      - name: Release gate
        run: npm run verify:release

  e2e:
    name: End-to-end quick start (storefront, real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            templates/persona-qa-dashboard/package-lock.json
      - name: Install platform dependencies
        run: npm ci
      - name: Install runtime template dependencies
        run: npm run setup:runtime
      - name: Install Chromium and system dependencies
        working-directory: templates/persona-qa-dashboard
        run: npx playwright install --with-deps chromium
      - name: Run quick start end to end
        run: npm run test:e2e

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
